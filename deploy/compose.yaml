name: hackalem
x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: hackalem-app:local
  env_file: ../.env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://hackalem:${POSTGRES_PASSWORD}@postgres:5432/hackalem
    OLLAMA_URL: http://ollama:11434
    QDRANT_URL: http://qdrant:6333
    DATA_DIR: /data
    HF_HUB_OFFLINE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
  volumes:
    - app_data:/data
    - model_data:/models
  networks: [private]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: hackalem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py}
      POSTGRES_DB: hackalem
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hackalem -d hackalem"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.34.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30s
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes: ["ollama_data:/root/.ollama"]
    networks: [private]
    gpus: all
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run scripts/init_env.py}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: ["qdrant_data:/qdrant/storage"]
    networks: [private]
    restart: unless-stopped

  api:
    <<: *app
    ports: ["127.0.0.1:8080:8000"]
    command: [python, -m, uvicorn, backend.app.main:app, --host, 0.0.0.0, --port, "8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    command: [python, -m, backend.app.worker]
    depends_on:
      api:
        condition: service_healthy

  n8n:
    profiles: [managed-n8n]
    image: docker.n8n.io/n8nio/n8n:2.40.5
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Qyzylorda
      TZ: Asia/Qyzylorda
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
      N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
      EXTERNAL_FRONTEND_HOOKS_URLS: ""
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
    volumes: ["n8n_data:/home/node/.n8n"]
    networks: [private]
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  app_data:
  model_data:
  n8n_data:

networks:
  private:
    name: hackalem_private
    internal: true
