<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HackAlem AI — Протокол совещания</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
<main>
  <header><div><p class="eyebrow">HACKALEM AI · RU / KZ</p><h1>Протокол совещания</h1>
    <p>Загрузите запись, чтобы получить саммари, поручения и транскрипт.</p></div>
    <a class="button secondary" href="/" id="new-meeting">Новая встреча</a></header>
  <section class="card" aria-labelledby="upload-heading">
    <h2 id="upload-heading">1. Загрузить запись</h2>
    <form id="upload-form">
      <div class="fields"><label>Название<input id="title" name="title" maxlength="200" required placeholder="Например, производственное совещание"></label>
      <label>Дата совещания <span class="muted">(необязательно)</span><input id="meeting-date" name="meeting_date" type="date"></label></div>
      <label>Аудио или видео<input id="file" type="file" accept=".wav,.mp3,.m4a,.mp4,.webm" required></label>
      <p class="muted">WAV, MP3, M4A, MP4, WebM. Обработка на локальном сервере.</p>
      <button id="upload-button" type="submit">Загрузить файл</button>
    </form>
    <p id="meeting-info" class="muted" hidden></p>
  </section>
  <section class="card" aria-labelledby="process-heading">
    <h2 id="process-heading">2. Обработать</h2>
    <div class="actions"><button id="analyze" disabled>Обработать</button><button id="refresh" class="secondary" disabled>Обновить результат</button></div>
    <p id="progress" role="status" aria-live="polite">Сначала загрузите запись.</p>
    <progress id="activity" aria-label="Обработка записи" hidden></progress>
    <p id="error" role="alert" hidden></p>
  </section>
  <section class="card" id="result" aria-labelledby="result-heading" hidden>
    <div class="result-header"><h2 id="result-heading">3. Результат</h2><div id="downloads" class="actions" hidden>
      <a id="docx" class="button secondary" download>Скачать DOCX</a><a id="pdf" class="button secondary" download>Скачать PDF</a>
    </div></div>
    <div class="tabs" role="tablist" aria-label="Результат совещания">
      <button role="tab" id="tab-summary" aria-controls="summary" aria-selected="true" data-panel="summary">Саммари</button>
      <button role="tab" id="tab-actions" aria-controls="actions" aria-selected="false" tabindex="-1" data-panel="actions">Поручения</button>
      <button role="tab" id="tab-transcript" aria-controls="transcript" aria-selected="false" tabindex="-1" data-panel="transcript">Транскрипт</button>
    </div>
    <div id="summary" role="tabpanel" aria-labelledby="tab-summary"></div>
    <div id="actions" role="tabpanel" aria-labelledby="tab-actions" hidden></div>
    <div id="transcript" role="tabpanel" aria-labelledby="tab-transcript" hidden></div>
  </section>
</main>
</body>
</html>
